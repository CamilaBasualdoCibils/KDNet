version: "3.8"

networks:
  AtlasNetTestNet:
    driver: overlay
services:
  Atlasnet-Controller:
    image: atlasnet-controller-dev
    networks: [AtlasNetTestNet]
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
  Atlasnet-Agent:
    image: atlasnet-agent-dev
    networks: [AtlasNetTestNet]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # REQUIRED
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
  Atlasnet-Database:
    image: valkey/valkey-bundle:latest
    command: ["valkey-server", "--appendonly", "yes", "--port", "6379"]
    networks: [AtlasNetTestNet]
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
  Atlasnet-Cartograph:
    image: atlasnet-cartograph-dev
    networks: [AtlasNetTestNet]
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

