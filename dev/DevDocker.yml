version: "3.8"

networks:
  AtlasNet:
    driver: overlay
services:
  Atlasnet-Node:
    image: atlasnet-node-dev
    networks: [AtlasNet]
    environment:
    - INGRESS_PORT=5000
    - REDIS_HOST=AtlasNet-DB
    - REDIS_PORT=6379
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    tty: true
    deploy:
      mode: replicated
      replicas: 5
      restart_policy:
        condition: on-failure
  AtlasNet-DB:
    image: atlasnet-db-dev
    networks: [AtlasNet]
    tty: true
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

 