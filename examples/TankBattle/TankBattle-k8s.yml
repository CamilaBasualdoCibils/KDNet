apiVersion: v1
kind: Namespace
metadata:
  name: atlasnet
---
# =========================
# DATABASE (Valkey)
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasnet-database
  namespace: atlasnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlasnet-database
  template:
    metadata:
      labels:
        app: atlasnet-database
    spec:
      containers:
        - name: valkey
          image: valkey/valkey-bundle:latest
          args: ["valkey-server", "--appendonly", "yes", "--port", "6379"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: atlasnet-database
  namespace: atlasnet
spec:
  type: NodePort   
  selector:
    app: atlasnet-database
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
      protocol: TCP
---
# =========================
# CONTROLLER (THE BRAIN)
# =========================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlasnet-controller-sa
  namespace: atlasnet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlasnet-controller-role
  namespace: atlasnet
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlasnet-controller-binding
  namespace: atlasnet
subjects:
  - kind: ServiceAccount
    name: atlasnet-controller-sa
    namespace: atlasnet
roleRef:
  kind: Role
  name: atlasnet-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasnet-controller
  namespace: atlasnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlasnet-controller
  template:
    metadata:
      labels:
        app: atlasnet-controller
    spec:
      serviceAccountName: atlasnet-controller-sa
      containers:
        - name: controller
          image: atlasnet-controller-dev
          imagePullPolicy: Never
          env:
            - name: ATLASNET_SHARD_DEFAULT_IMAGE
              value: "tankbattle-dev:latest"
---
# =========================
# SHARDS (STATEFULSET)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: atlasnet-shard
  namespace: atlasnet
spec:
  clusterIP: None
  selector:
    app: atlasnet-shard
  ports:
    - port: 7777
      targetPort: 7777
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlasnet-shard
  namespace: atlasnet
spec:
  serviceName: atlasnet-shard
  replicas: 0
  selector:
    matchLabels:
      app: atlasnet-shard
  template:
    metadata:
      labels:
        app: atlasnet-shard
    spec:
      containers:
        - name: shard
          image: atlasnet-shard-dev
          imagePullPolicy: Never
          ports:
            - containerPort: 7777
---
# =========================
# PROXY (STATEFULSET)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: atlasnet-proxy
  namespace: atlasnet
spec:
  clusterIP: None
  selector:
    app: atlasnet-proxy
  ports:
    - name: tcp
      port: 2555
      targetPort: 25568
      protocol: TCP
    - name: udp
      port: 2555
      targetPort: 25568
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlasnet-proxy
  namespace: atlasnet
spec:
  serviceName: atlasnet-proxy
  replicas: 0
  selector:
    matchLabels:
      app: atlasnet-proxy
  template:
    metadata:
      labels:
        app: atlasnet-proxy
    spec:
      containers:
        - name: proxy
          image: atlasnet-proxy-dev
          imagePullPolicy: Never
          ports:
            - containerPort: 25568