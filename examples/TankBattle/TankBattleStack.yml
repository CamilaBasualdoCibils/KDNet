version: "3.8"

networks:
  TankBattleNet:
    driver: overlay
services:
  Atlasnet-Controller:
    image: atlasnet-controller-dev
    networks: [TankBattleNet]
    deploy:
      #labels:
        #atlasnet.role: controller # REQUIRED
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  Atlasnet-Agent:
    image: atlasnet-agent-dev
    networks: [TankBattleNet]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # REQUIRED
    deploy:
      mode: global # REQUIRED. 1 per node
      #labels:
        #atlasnet.role: agent # OPTIONAL, determines which nodes can run shards
      restart_policy:
        condition: on-failure

  atlasnet-database:
    image: valkey/valkey:latest
    command: ["valkey-server", "--appendonly", "yes", "--port", "6379"]
    networks: [TankBattleNet]
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  atlasnet-cartograph-frontend:
    image: atlasnet-cartograph-frontend-dev
    networks: [TankBattleNet]
    ports:
      - target : 80
        published: 80
        protocol: tcp
        mode: ingress
    environment:
      - FRONTEND_PORT=4173
      - BACKEND_HOST=atlasnet-cartograph-backend:2000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
 
  atlasnet-cartograph-backend:
    image: atlasnet-cartograph-backend-dev
    networks: [TankBattleNet]
    environment:
      - BACKEND_PORT=2000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
  AtlasNet-Proxy:
    image: atlasnet-proxy-dev
    networks: [TankBattleNet]
    ports:
      - target: 25568
        published: 2555
        protocol: tcp
        mode: ingress
      - target: 25568
        published: 2555
        protocol: udp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure