# =========================
# CARTOGRAPH BACKEND
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasnet-cartograph-backend
  namespace: atlasnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlasnet-cartograph-backend
  template:
    metadata:
      labels:
        app: atlasnet-cartograph-backend
    spec:
      containers:
        - name: backend
          image: atlasnet-cartograph-backend-dev
          imagePullPolicy: Never
          env:
            - name: BACKEND_PORT
              value: "2000"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: atlasnet-cartograph-backend
  namespace: atlasnet
spec:
  selector:
    app: atlasnet-cartograph-backend
  ports:
    - port: 2000
      targetPort: 2000
      protocol: TCP

---
# =========================
# CARTOGRAPH FRONTEND
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasnet-cartograph-frontend
  namespace: atlasnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlasnet-cartograph-frontend
  template:
    metadata:
      labels:
        app: atlasnet-cartograph-frontend
    spec:
      containers:
        - name: frontend
          image: atlasnet-cartograph-frontend-dev
          imagePullPolicy: Never
          env:
            - name: FRONTEND_PORT
              value: "4173"
            - name: BACKEND_HOST
              value: "atlasnet-cartograph-backend:2000"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: atlasnet-cartograph-frontend
  namespace: atlasnet
spec:
  type: NodePort
  selector:
    app: atlasnet-cartograph-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP